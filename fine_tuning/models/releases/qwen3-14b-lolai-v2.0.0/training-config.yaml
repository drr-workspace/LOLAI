# LOLAI Advisor — Qwen3-14B QLoRA
# Eseguire dalla root del repository con:
#   mlx_lm.lora --config training/configs/qwen3-14b-qlora.yaml
#
# Prerequisiti:
#   models/base/qwen3-14b-4bit/
#   datasets/releases/2.0.0/train.jsonl
#   datasets/releases/2.0.0/valid.jsonl
#
# test.jsonl e challenge.jsonl NON vengono usati durante il training.

# Modello MLX quantizzato: usando un modello quantizzato, MLX-LM esegue QLoRA.
model: "models/base/qwen3-14b-4bit"

# Modalità training.
train: true
fine_tune_type: "lora"

# Dataset locale contenente train.jsonl e valid.jsonl.
data: "datasets/releases/2.0.0"

# Riproducibilità.
seed: 42

# Ottimizzatore.
optimizer: "adamw"
learning_rate: 5.0e-6

# La release contiene 10.000 esempi di training. La selezione finale del
# checkpoint dipende dalle metriche sul validation set, non dalla sola loss.
iters: 3000

# Memoria e batch.
batch_size: 2
grad_accumulation_steps: 4
max_seq_length: 4096
grad_checkpoint: true

# Qwen3-14B è dense: adattiamo gli ultimi 24 layer.
num_layers: 24

# Calcola la loss soltanto sulla risposta assistant finale.
mask_prompt: true

# Validazione e logging.
val_batches: 250
steps_per_report: 10
steps_per_eval: 250

# Adapter e checkpoint.
adapter_path: "models/adapters/qwen3-14b-lolai-v2.0.0-retrain"
resume_adapter_file: null
save_every: 100

# Il test set resta isolato fino al congelamento del modello candidato.
test: false
test_batches: -1

# Layer lineari sui quali applicare LoRA.
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 32.0
  dropout: 0.10
